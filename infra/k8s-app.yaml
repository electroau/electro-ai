apiVersion: apps/v1
kind: Deployment
metadata:
  name: electro-ai-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: electro-ai-backend
  template:
    metadata:
      labels:
        app: electro-ai-backend
    spec:
      containers:
        - name: backend
          image: electro-ai/backend:latest
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: electro-ai-backend
spec:
  selector:
    app: electro-ai-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
